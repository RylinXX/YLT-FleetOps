server
{
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name ylt.etgq.com;

    # SSL配置
    ssl_certificate    /www/server/panel/vhost/cert/ylt.etgq.com/ylt.etgq.com_bundle.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/ylt.etgq.com/ylt.etgq.com.key;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;

    # HTTP强制跳转HTTPS
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }

    # Keep the directory application under /api/ only.
    include /www/server/panel/vhost/nginx/extension/capcloud-api-location.inc;
    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
    }

    # 静态资源缓存
    location ~* \.(gif|jpg|jpeg|png|bmp|swf|ico|svg|js|css|woff|woff2|ttf|mp3|wav)$
    {
        proxy_pass http://127.0.0.1:8002;
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    # 一键申请SSL证书验证目录
    location /.well-known{
        allow all;
    }

    access_log  /www/wwwlogs/ylt.etgq.com.log;
    error_log  /www/wwwlogs/ylt.etgq.com.error.log;
}
